# LadiesGo — nginx proxy+cache+TLS (exemplo pronto)
# Ficheiro: selfhost/nginx.conf  (montado em /etc/nginx/nginx.conf, só leitura)
# Upstreams (nomes = serviços do docker-compose.yml):
#   osrm:5000       → routing car Angola (OSRM)
#   photon:2322     → geocode/search Angola (Photon + OpenSearch)
#   tileserver:8080 → vetor+raster Angola (tileserver-gl)
#
# COMO USAR (1º boot = SÓ http):
#  1. Mantém o bloco :443 COMENTADO, `docker compose up -d nginx`, corre certbot (README §8).
#  2. Descomenta o bloco :443, `docker compose exec nginx nginx -s reload`.
# Troca `maps.example.com` pelo teu DOMAIN em ambos os server blocks.

user nginx;
worker_processes auto;
worker_rlimit_nofile 65536;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ---- logs ----
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" X-Cache:$upstream_cache_status rt=$request_time';
  access_log /var/log/nginx/access.log main;

  # ---- performance base ----
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  keepalive_requests 200;
  client_max_body_size 2m;
  server_tokens off;

  # ---- gzip (só texto/json; NÃO comprimir .pbf/.mvt que já vêm comprimidos) ----
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types application/json application/javascript text/css text/plain application/xml;
  # tiles vetoriais .pbf/.mvt: tileserver já serve com content-encoding; não tocar.

  # ---- rate-limit básico (por IP) ----
  # 10r/s rotas (ETA/trip calc), 5r/s pesquisa (evita scrape), 20r/s tiles (map pan/zoom).
  limit_req_zone $binary_remote_addr zone=route_limit:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=search_limit:10m rate=5r/s;
  limit_req_zone $binary_remote_addr zone=tiles_limit:10m rate=20r/s;
  limit_req_status 429;
  limit_conn_zone $binary_remote_addr zone=addr:10m;

  # ---- caches em disco (volume nginx-cache) ----
  # rotas: 1h (queries repetidas de ETA no mesmo par origem/destino).
  proxy_cache_path /var/cache/nginx/route  levels=1:2 keys_zone=route_cache:50m  max_size=1g inactive=60m  use_temp_path=off;
  # pesquisa: 7d ("maianga", "talatona" repetem-se muito).
  proxy_cache_path /var/cache/nginx/search levels=1:2 keys_zone=search_cache:50m max_size=512m inactive=7d   use_temp_path=off;
  # tiles: 30d (imutáveis por versão do .mbtiles; invalidar = mudar nome do estilo).
  proxy_cache_path /var/cache/nginx/tiles  levels=1:2 keys_zone=tiles_cache:100m max_size=5g  inactive=30d  use_temp_path=off;

  # ---- upstreams (nomes Docker; nginx resolve via DNS interno do compose) ----
  upstream osrm_backend {
    server osrm:5000 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }
  upstream photon_backend {
    server photon:2322 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }
  upstream tileserver_backend {
    server tileserver:8080 max_fails=3 fail_timeout=30s;
    keepalive 64;
  }

  # healthcheck interno do compose (GET /healthz → 200 "ok")
  server {
    listen 80 default_server;
    server_name _;
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }
  }

  # ================= HTTP :80 — ACME + proxy (1º boot) =================
  server {
    listen 80;
    listen [::]:80;
    server_name maps.example.com;

    # Certbot webroot (NÃO apagar; sem isto a renovação falha)
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
      try_files $uri =404;
    }

    # Depois do TLS activo, descomenta as 2 linhas seguintes p/ forçar https:
    # location / { return 301 https://$host$request_uri; }

    # ---- /route/ → osrm:5000 (preserva path completo /route/v1/...) ----
    location /route/ {
      limit_except GET HEAD OPTIONS { deny all; }
      limit_req zone=route_limit burst=20 nodelay;
      limit_conn addr 20;

      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 20s;
      proxy_send_timeout 20s;

      # cache 1h só para 200/302 GET; erros NÃO cachear
      proxy_cache route_cache;
      proxy_cache_key "$scheme$host$request_uri";
      proxy_cache_methods GET HEAD;
      proxy_cache_valid 200 302 1h;
      proxy_cache_valid 404 429 1m;
      proxy_cache_valid any 0;
      proxy_cache_lock on;
      proxy_cache_background_update on;
      proxy_ignore_headers Set-Cookie;
      proxy_hide_header Set-Cookie;
      add_header X-Cache-Status $upstream_cache_status always;

      proxy_pass http://osrm_backend; # SEM barra final = preserva /route/... (OSRM exige)
    }

    # ---- /search/ → photon:2322 (tira prefixo: /search/api → /api) ----
    # App chama: GET /search/api?q=maianga&limit=10&lang=pt
    #            GET /search/reverse?lat=-8.838&lon=13.234
    location /search/ {
      limit_except GET HEAD OPTIONS { deny all; }
      limit_req zone=search_limit burst=10 nodelay;
      limit_conn addr 10;

      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 15s;

      proxy_cache search_cache;
      proxy_cache_key "$scheme$host$request_uri";
      proxy_cache_methods GET HEAD;
      proxy_cache_valid 200 7d;
      proxy_cache_valid 404 10m;
      proxy_cache_valid any 0;
      proxy_cache_lock on;
      proxy_ignore_headers Set-Cookie;
      proxy_hide_header Set-Cookie;
      add_header X-Cache-Status $upstream_cache_status always;

      proxy_pass http://photon_backend/; # COM barra final = /search/api → /api (Photon exige)
    }

    # ---- /tiles/ → tileserver:8080 (tira prefixo: /tiles/styles → /styles) ----
    location /tiles/ {
      limit_except GET HEAD OPTIONS { deny all; }
      limit_req zone=tiles_limit burst=40 nodelay;
      limit_conn addr 30;

      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;

      proxy_cache tiles_cache;
      proxy_cache_key "$scheme$host$request_uri";
      proxy_cache_methods GET HEAD;
      proxy_cache_valid 200 30d;
      proxy_cache_valid 404 1m;
      proxy_cache_valid any 0;
      proxy_cache_lock on;
      proxy_cache_revalidate on;
      # tiles .pbf/.png já vêm com ETag/Cache-Control do tileserver; respeitar origem:
      proxy_cache_background_update on;
      add_header X-Cache-Status $upstream_cache_status always;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable" always;

      proxy_pass http://tileserver_backend/; # COM barra final = /tiles/data → /data
    }
  }

  # ================= HTTPS :443 — DESCOMENTAR APÓS CERTBOT (README §8) =================
  # server {
  #   listen 443 ssl;
  #   listen [::]:443 ssl;
  #   server_name maps.example.com;
  #
  #   ssl_certificate     /etc/letsencrypt/live/maps.example.com/fullchain.pem;
  #   ssl_certificate_key /etc/letsencrypt/live/maps.example.com/privkey.pem;
  #   ssl_protocols TLSv1.2 TLSv1.3;
  #   ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  #   ssl_prefer_server_ciphers off;
  #   ssl_session_cache shared:SSL:10m;
  #   ssl_session_timeout 1d;
  #   add_header Strict-Transport-Security "max-age=63072000" always;
  #
  #   # COPIAR para aqui os 3 location blocks /route/ /search/ /tiles/ do server :80,
  #   # acrescentando em cada um: proxy_set_header X-Forwarded-Proto https;
  #   # (mantém o :80 só com ACME + redirect 301 — ver nota acima)
  # }
}
