name: keep-alive (não deixar dormir)

# DESATIVADO: produção é Cloudflare (nunca dorme). Render suspenso.
on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping LadiesGo single-service
        env:
          APP_URL: ${{ secrets.LADIESGO_URL }}
        run: |
          echo "Ping $APP_URL/ping"
          curl -fsS -m 20 "$APP_URL/ping" || echo "a acordar..."
          curl -fsS -m 20 "$APP_URL/api/v1/health" || true
