name: iOS TestFlight (Xcode, sem EAS)

# Compila o IPA diretamente com o Xcode no runner macOS (nao usa a quota do EAS).
# A assinatura (certificado de distribuicao + perfil App Store) e o upload ao
# TestFlight sao feitos pelo fastlane com a chave App Store Connect.
# Secrets necessarios:
#   ASC_API_KEY_P8 -> conteudo do ficheiro .p8 da chave App Store Connect.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-ios.yml'
      - 'mobile/fastlane/**'

jobs:
  build-submit:
    runs-on: macos-latest
    env:
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
      ASC_KEY_ID: 6CQX832WVJ
      ASC_ISSUER_ID: 92705617-9a5f-4c92-8656-d810930fc323
      ASC_KEY_PATH: ${{ github.workspace }}/mobile/asc-key.p8
      BUILD_NUMBER: ${{ github.run_number }}
      EXPO_PUBLIC_API_URL: https://ladiesgo-api.ladiesgo-angola.workers.dev/api/v1
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Verificar chave ASC
        run: |
          if [ -z "$ASC_API_KEY_P8" ]; then
            echo "::error::Falta o secret ASC_API_KEY_P8"
            exit 1
          fi
          printf '%s' "$ASC_API_KEY_P8" > asc-key.p8
      - name: Prebuild (gera projecto nativo iOS)
        run: npx expo prebuild --platform ios --clean --no-install
      - name: CocoaPods
        run: pod install --project-directory=ios
      - name: Detetar workspace/scheme
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n1)
          APP=$(basename "$WORKSPACE" .xcworkspace)
          SCHEMES=$(xcodebuild -list -workspace "$WORKSPACE" -json | python3 -c "import sys,json;print('\n'.join(json.load(sys.stdin)['workspace']['schemes']))")
          SCHEME="$APP"
          if ! echo "$SCHEMES" | grep -qx "$SCHEME"; then
            SCHEME=$(echo "$SCHEMES" | grep -v -E 'Pods|Application' | head -n1)
          fi
          echo "Workspace: $WORKSPACE / App: $APP / Scheme: $SCHEME"
          echo "WORKSPACE=ios/$WORKSPACE" >> "$GITHUB_ENV"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
      - name: Instalar fastlane
        run: gem install fastlane --no-document
      - name: Build + TestFlight
        run: fastlane release
      - name: Guardar IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ladiesgo-ipa
          path: mobile/build/ladiesgo.ipa
          if-no-files-found: warn
