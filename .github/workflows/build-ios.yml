name: iOS TestFlight (Xcode, sem EAS)

# Compila o IPA diretamente com o Xcode no runner macOS (nao usa a quota do EAS).
# Assinatura (certificado + perfil App Store) e upload ao TestFlight via fastlane.
# Secrets:
#   ASC_API_KEY_P8   -> conteudo do ficheiro AuthKey_XXXX.p8 da App Store Connect
#   DIST_CERT_P12     -> (opcional) .p12 do certificado de distribuicao em base64.
#                        Na 1a execucao fica vazio, o build cria um novo certificado
#                        e exporta dist_cert.p12 como artefacto. Depois define-se o
#                        secret com esse ficheiro para reutilizar sempre o mesmo.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-ios.yml'
      - 'mobile/fastlane/**'
      - 'mobile/app.json'

jobs:
  build-submit:
    runs-on: macos-latest
    env:
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
      DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
      ASC_KEY_ID: 6CQX832WVJ
      ASC_ISSUER_ID: 92705617-9a5f-4c92-8656-d810930fc323
      ASC_KEY_PATH: ${{ github.workspace }}/mobile/asc-key.p8
      MOBILE_DIR: ${{ github.workspace }}/mobile
      DIST_CERT_PASSWORD: ladiesgo
      BUILD_NUMBER: ${{ github.run_number }}
      EXPO_PUBLIC_API_URL: https://ladiesgo-api.ladiesgo-angola.workers.dev/api/v1
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Verificar chave ASC
        run: |
          if [ -z "$ASC_API_KEY_P8" ]; then
            echo "::error::Falta o secret ASC_API_KEY_P8"
            exit 1
          fi
          printf '%s' "$ASC_API_KEY_P8" > asc-key.p8
      - name: Preparar keychain (+ certificado existente, se houver)
        run: |
          set -euo pipefail
          KC="$HOME/Library/Keychains/ladiesgo.keychain-db"
          KC_PW=$(openssl rand -hex 16)
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security list-keychains -d user -s "$KC" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -s "$KC"
          if [ -n "${DIST_CERT_P12:-}" ]; then
            echo "A importar certificado existente (DIST_CERT_P12)"
            echo "$DIST_CERT_P12" | base64 --decode > dist_cert.p12
            security import dist_cert.p12 -k "$KC" -P "$DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC"
          fi
          echo "KEYCHAIN_PW=$KC_PW" >> "$GITHUB_ENV"
      - name: Prebuild (gera projecto nativo iOS)
        run: npx expo prebuild --platform ios --clean --no-install
      - name: Definir build number (CFBundleVersion)
        run: |
          set -euo pipefail
          PLIST=$(ls ios/LadiesGo/Info.plist 2>/dev/null || ls ios/*/Info.plist | head -n1)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUMBER}" "$PLIST"
          echo "CFBundleVersion=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST") no $PLIST"
      - name: CocoaPods
        run: pod install --project-directory=ios
      - name: Detetar workspace/scheme
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n1)
          APP=$(basename "$WORKSPACE" .xcworkspace)
          SCHEMES=$(xcodebuild -list -workspace "$WORKSPACE" -json | python3 -c "import sys,json;print('\n'.join(json.load(sys.stdin)['workspace']['schemes']))")
          SCHEME="$APP"
          if ! echo "$SCHEMES" | grep -qx "$SCHEME"; then
            SCHEME=$(echo "$SCHEMES" | grep -v -E 'Pods|Application' | head -n1)
          fi
          echo "Workspace: $WORKSPACE / App: $APP / Scheme: $SCHEME"
          echo "WORKSPACE=$MOBILE_DIR/ios/$WORKSPACE" >> "$GITHUB_ENV"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
      - name: Instalar fastlane
        run: gem install fastlane --no-document
      - name: Build + TestFlight
        run: fastlane release
      - name: Guardar IPA + certificado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ladiesgo-ios
          path: |
            mobile/build/ladiesgo.ipa
            mobile/dist_cert.p12
          if-no-files-found: warn
