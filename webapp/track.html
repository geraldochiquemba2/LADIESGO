<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#5b21c9"><title>LadiesGo! – Acompanhar viagem</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{margin:0;box-sizing:border-box}html,body{height:100%}body{font-family:Inter,system-ui,sans-serif;background:#ece8f3;color:#15111f}#map{position:absolute;inset:0 0 196px 0}.leaflet-container{background:#ece8f3}.card{position:absolute;left:12px;right:12px;bottom:12px;background:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 -8px 30px rgba(30,10,70,.25);max-width:560px;margin:0 auto;max-height:184px;overflow-y:auto}.card h2{font-size:16px;margin-bottom:2px}.mut{color:#6c6680;font-size:13px}.row{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13.5px}.dot{flex:none;width:12px;height:12px;border-radius:50%;background:#12a150;animation:bl 1.6s infinite}@keyframes bl{50%{opacity:.35}}.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:#ede9fe;color:#5b21c9}.tels{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.tels a{flex:1 1 40%;text-align:center;padding:10px 6px;border-radius:12px;background:#5b21c9;color:#fff;font-size:13px;font-weight:700;text-decoration:none}.tels a small{display:block;font-weight:400;font-size:11px;opacity:.85}.err{text-align:center;padding:60px 20px}</style></head><body>
<div id="map"></div>
<div class="card" id="card"><h2>LadiesGo! 💜</h2><p class="mut" id="st">A ligar…</p><div class="row"><span class="dot"></span><span id="info">A carregar viagem…</span></div><div class="tels" id="tels" style="display:none"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  var qs={};try{qs=new URLSearchParams(location.search);}catch(e){qs={get:function(){return '';}};}
  var id=qs.get('id')||'';
  var emgRaw=qs.get('emg')||'';
  var card=document.getElementById('card');
  if(!id){card.innerHTML='<h2>LadiesGo! 💜</h2><p class="mut">Ligação inválida. Pede à passageira o link de partilha.</p>';return;}
  var map=L.map('map').setView([-8.839,13.289],13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
  map.attributionControl.setPrefix('© OpenStreetMap');
  var carMk=null,destMk=null,pickMk=null,stopMks=[],done=false;
  var ST={REQUESTED:'À espera de motorista',ACCEPTED:'Motorista a caminho',DRIVER_ARRIVED:'Motorista chegou',IN_PROGRESS:'Em viagem',COMPLETED:'Viagem concluída ✓',CANCELLED:'Viagem cancelada'};
  function emoji(c){return L.divIcon({className:'',html:'<div style="font-size:30px;line-height:30px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))">'+c+'</div>',iconSize:[30,30],iconAnchor:[15,28]});}
  function stopIcon(n){return L.divIcon({className:'',html:'<div style="width:26px;height:26px;border-radius:50%;background:#7c3aed;color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)">'+n+'</div>',iconSize:[26,26],iconAnchor:[13,13]});}
  function telBtn(label,sub,phone){var digits=String(phone||'').replace(/\D/g,'');if(!digits)return '';return '<a href="tel:+'+digits+'">'+label+(sub?'<small>'+sub+'</small>':'')+'</a>';}
  function paintContacts(t){
    var box=document.getElementById('tels');
    var h='';
    if(t.driver&&t.driver.phone)h+=telBtn('📞 '+t.driver.name,'Motorista',t.driver.phone);
    if(t.passenger&&t.passenger.phone)h+=telBtn('📞 '+t.passenger.name,'Passageira',t.passenger.phone);
    if(emgRaw){emgRaw.split('~').slice(0,3).forEach(function(p){var i=p.indexOf(':');var nm=i>=0?p.slice(0,i):'';var ph=i>=0?p.slice(i+1):p;if(ph)h+=telBtn('🆘 '+nm,'Emergência',ph);});}
    if(h){box.innerHTML=h;box.style.display='flex';}
  }
  async function tick(){
    if(done)return;
    try{
      var r=await fetch('/api/v1/trips/public/'+encodeURIComponent(id),{cache:'no-store'});
      if(!r.ok)throw 0;
      var t=await r.json();
      var st=String(t.status||'');
      var started=(st==='DRIVER_ARRIVED'||st==='IN_PROGRESS'||st==='COMPLETED');
      document.getElementById('st').innerHTML='<span class="pill">'+(ST[st]||st)+'</span>';
      var info=[];
      if(t.driver&&t.driver.name){var carTxt=t.driver.carFull||t.driver.car||'';info.push('🚗 '+t.driver.name+(carTxt?' · '+carTxt:'')+(t.driver.plate?' · '+t.driver.plate:'')+(t.driver.rating?' · ★ '+t.driver.rating:''));}
      if(t.dest&&t.dest.name)info.push('📍 '+(t.dest.name||''));
      document.getElementById('info').textContent=info.join('  —  ')||'A acompanhar…';
      var cw=document.getElementById('carphoto');if(t.driver&&t.driver.photo){if(!cw){var im=document.createElement('img');im.id='carphoto';im.alt='Viatura';im.style.cssText='width:100%;border-radius:12px;margin-top:8px;max-height:150px;object-fit:cover';document.getElementById('card').appendChild(im);}document.getElementById('carphoto').src=t.driver.photo;}else if(cw){cw.remove();}
      paintContacts(t);
      var pts=[];
      // Bola da recolha só antes de arrancar; depois: só carro + destino + paragens.
      if(!started&&t.pickup&&t.pickup.lat!=null){if(!pickMk)pickMk=L.marker([t.pickup.lat,t.pickup.lng],{icon:emoji('🟣'),interactive:false}).addTo(map);else pickMk.setLatLng([t.pickup.lat,t.pickup.lng]);pts.push([t.pickup.lat,t.pickup.lng]);}
      else if(pickMk){try{map.removeLayer(pickMk);}catch(e){}pickMk=null;}
      if(t.dest&&t.dest.lat!=null){if(!destMk)destMk=L.marker([t.dest.lat,t.dest.lng],{icon:emoji('🏁'),interactive:false}).addTo(map);else destMk.setLatLng([t.dest.lat,t.dest.lng]);pts.push([t.dest.lat,t.dest.lng]);}
      var stops=Array.isArray(t.stops)?t.stops.filter(function(s){return s&&(s.lat!=null||(s.c&&s.c[0]!=null));}):[];
      stopMks.forEach(function(m){try{map.removeLayer(m);}catch(e){}});stopMks=[];
      stops.slice(0,3).forEach(function(s,i){var ll=s.lat!=null?[s.lat,s.lng]:s.c;var mk=L.marker(ll,{icon:stopIcon(i+1),interactive:false});mk.addTo(map);stopMks.push(mk);pts.push(ll);});
      if(t.driver&&t.driver.lat!=null){if(!carMk)carMk=L.marker([t.driver.lat,t.driver.lng],{icon:emoji('🚕'),interactive:false}).addTo(map);else carMk.setLatLng([t.driver.lat,t.driver.lng]);pts.push([t.driver.lat,t.driver.lng]);}
      if(pts.length){try{map.flyToBounds(L.latLngBounds(pts).pad(0.3),{duration:0.8});}catch(e){}}
      if(st==='COMPLETED'||st==='CANCELLED'){if(carMk){try{map.removeLayer(carMk);}catch(e){}carMk=null;}done=true;}
    }catch(e){document.getElementById('info').textContent='Sem ligação. A tentar de novo…';}
  }
  tick();setInterval(tick,4000);
})();
</script></body></html>
