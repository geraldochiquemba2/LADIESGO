<div id="map"></div>
<div class="card" id="card"><div class="hdr"><h2>LadiesGo! 🦋</h2><div class="drv"><span class="drvname" id="drvname"></span><img id="carphoto" class="driverphoto" alt="Foto da motorista"></div></div><p class="mut" id="st">A ligar…</p><div class="row"><span class="dot"></span><span id="info">A carregar viagem…</span></div><div class="tels" id="tels" style="display:none"></div></div><div id="photoLb" class="photolb"><img id="photoBig" alt="Foto da motorista"><span class="lbc">Toca para fechar</span></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  var qs={};try{qs=new URLSearchParams(location.search);}catch(e){qs={get:function(){return '';}};}
  var id=qs.get('id')||'';
  var emgRaw=qs.get('emg')||'';
  var card=document.getElementById('card');
  (function(){var thumb=document.getElementById('carphoto'),lb=document.getElementById('photoLb'),big=document.getElementById('photoBig');if(!thumb||!lb||!big)return;thumb.addEventListener('click',function(){var s=thumb.getAttribute('src');if(!s)return;big.src=s;lb.classList.add('on');});lb.addEventListener('click',function(){lb.classList.remove('on');big.removeAttribute('src');});document.addEventListener('keydown',function(e){if(e.key==='Escape'&&lb.classList.contains('on')){lb.classList.remove('on');big.removeAttribute('src');}});})();
  if(!id){card.innerHTML='<h2>LadiesGo! 🦋</h2><p class="mut">Ligação inválida. Pede à passageira o link de partilha.</p>';return;}
  var map=L.map('map').setView([-8.839,13.289],13);
  var CARTO_KEY='';function cartoTiles(u){return CARTO_KEY?u+(u.indexOf('?')>=0?'&':'?')+'key='+encodeURIComponent(CARTO_KEY):u;}var _tileErr=0;L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).on('tileerror',function(){try{_tileErr++;if(_tileErr===12){map.eachLayer(function(l){try{if(l._url&&l._url.indexOf('openstreetmap')>=0)map.removeLayer(l);}catch(e){}});L.tileLayer(cartoTiles('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png'),{maxZoom:19}).addTo(map);}}catch(e){}}).addTo(map);
  map.attributionControl.setPrefix('© OpenStreetMap');
  var carMk=null,destMk=null,pickMk=null,stopMks=[],done=false;var fitted=false,stopSig='';function glideTo(mk,ll,ms){try{if(!mk||ll==null)return;var tgt=L.latLng(ll[0],ll[1]);mk._target=tgt;if(mk._glide)return;var tau=ms||320,last=null;function step(ts){try{var cur=mk.getLatLng(),g=mk._target||tgt,dt=(last==null?16:(ts-last));last=ts;if(dt<0)dt=16;if(dt>200)dt=200;var k=1-Math.exp(-dt/tau),nlat=cur.lat+(g.lat-cur.lat)*k,nlng=cur.lng+(g.lng-cur.lng)*k,dx=g.lat-nlat,dy=g.lng-nlng;if(dx*dx+dy*dy<1e-12){mk.setLatLng(g);mk._glide=null;return}mk.setLatLng([nlat,nlng]);mk._glide=requestAnimationFrame(step)}catch(e){try{mk.setLatLng(mk._target||tgt)}catch(_){}mk._glide=null}}mk._glide=requestAnimationFrame(step)}catch(e){try{mk.setLatLng(ll)}catch(_){}}}
  var ST={REQUESTED:'À espera de motorista',ACCEPTED:'Motorista a caminho',DRIVER_ARRIVED:'Motorista chegou',IN_PROGRESS:'Em viagem',COMPLETED:'Viagem concluída ✓',CANCELLED:'Viagem cancelada'};
  function emoji(c){return L.divIcon({className:'',html:'<div style="font-size:30px;line-height:30px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))">'+c+'</div>',iconSize:[30,30],iconAnchor:[15,28]});}
  function stopIcon(n){return L.divIcon({className:'',html:'<div style="width:26px;height:26px;border-radius:50%;background:#61188E;color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)">'+n+'</div>',iconSize:[26,26],iconAnchor:[13,13]});}
  function telBtn(label,sub,phone){var digits=String(phone||'').replace(/\D/g,'');if(!digits)return '';return '<a href="tel:+'+digits+'">'+label+(sub?'<small>'+sub+'</small>':'')+'</a>';}
  function paintContacts(t){
    var box=document.getElementById('tels');
    var h='';
    if(t.driver&&t.driver.phone)h+=telBtn('📞 '+t.driver.name,'Motorista',t.driver.phone);
    if(t.passenger&&t.passenger.phone)h+=telBtn('📞 '+t.passenger.name,'Passageira',t.passenger.phone);
    if(emgRaw){emgRaw.split('~').slice(0,3).forEach(function(p){var i=p.indexOf(':');var nm=i>=0?p.slice(0,i):'';var ph=i>=0?p.slice(i+1):p;if(ph)h+=telBtn('🆘 '+nm,'Emergência',ph);});}
    if(h){box.innerHTML=h;box.style.display='flex';}
  }
  async function tick(){
    if(done)return;
    try{
      var r=await fetch('/api/v1/trips/public/'+encodeURIComponent(id),{cache:'no-store'});
      if(!r.ok)throw 0;
      var t=await r.json();
      var st=String(t.status||'');
      var started=(st==='DRIVER_ARRIVED'||st==='IN_PROGRESS'||st==='COMPLETED');
      document.getElementById('st').innerHTML='<span class="pill">'+(ST[st]||st)+'</span>';
      var info=[];
      var _dt=(function(){try{var s=(st==='CANCELLED'||st==='COMPLETED')?(t.updatedAt||t.createdAt):(t.createdAt||t.updatedAt);var d=new Date(s);if(isNaN(d.getTime()))return '';return d.toLocaleString('pt-PT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}catch(e){return '';}})();
      if(_dt)info.push('📅 '+_dt);
      if(st==='CANCELLED'){var _cb=(t.cancelledBy==='driver'?'motorista':(t.cancelledBy==='passenger'?'passageira':(t.cancelledBy||'')));info.push('❌ Cancelada por '+(_cb||'—')+(t.cancelReason?(' · '+t.cancelReason):''));}
      if(t.pickup&&t.pickup.name)info.push('🟢 De '+(t.pickup.name||''));
      if(t.dest&&t.dest.name)info.push('🏁 Para '+(t.dest.name||''));
      var _sts=Array.isArray(t.stops)?t.stops.filter(function(s){return s&&(s.n||s.a)}).slice(0,3):[];
      if(_sts.length)info.push('① Paragens: '+_sts.map(function(s,i){return (i+1)+') '+(s.n||s.a)}).join('; '));
      document.getElementById('info').textContent=info.join('   —   ')||'A acompanhar…';
      var _dn=document.getElementById('drvname');if(_dn){var _d=t.driver||{};var _tx='';if(_d.name)_tx+='🚗 '+_d.name;var _c2=(_d.carFull||_d.car||'');if(_c2)_tx+=(_tx?'\n':'')+_c2+(_d.plate?' · '+_d.plate:'');if(_d.rating)_tx+=(_c2?' · ':'\n')+'★ '+_d.rating;_dn.textContent=_tx.trim();}
      var _ph=document.getElementById('carphoto');if(_ph){if(t.driver&&t.driver.photo){if(_ph.getAttribute('src')!==t.driver.photo)_ph.src=t.driver.photo;_ph.style.display='block';}else{_ph.style.display='none';_ph.removeAttribute('src');}}
      paintContacts(t);
      var pts=[];
      // Bola da recolha só antes de arrancar; depois: só carro + destino + paragens.
      if(!started&&t.pickup&&t.pickup.lat!=null){if(!pickMk)pickMk=L.marker([t.pickup.lat,t.pickup.lng],{icon:emoji('🟣'),interactive:false}).addTo(map);else pickMk.setLatLng([t.pickup.lat,t.pickup.lng]);pts.push([t.pickup.lat,t.pickup.lng]);}
      else if(pickMk){try{map.removeLayer(pickMk);}catch(e){}pickMk=null;}
      if(t.dest&&t.dest.lat!=null){if(!destMk)destMk=L.marker([t.dest.lat,t.dest.lng],{icon:emoji('🏁'),interactive:false}).addTo(map);else destMk.setLatLng([t.dest.lat,t.dest.lng]);pts.push([t.dest.lat,t.dest.lng]);}
      var stops=Array.isArray(t.stops)?t.stops.filter(function(s){return s&&(s.lat!=null||(s.c&&s.c[0]!=null));}):[];
      var _sig=stops.slice(0,3).map(function(s){var _ll=s.lat!=null?[s.lat,s.lng]:s.c;return _ll[0]+','+_ll[1];}).join('|');stops.slice(0,3).forEach(function(s){var _pl=s.lat!=null?[s.lat,s.lng]:s.c;pts.push(_pl);});if(_sig!==stopSig){stopSig=_sig;stopMks.forEach(function(m){try{map.removeLayer(m);}catch(e){}});stopMks=[];stops.slice(0,3).forEach(function(s,i){var ll=s.lat!=null?[s.lat,s.lng]:s.c;var mk=L.marker(ll,{icon:stopIcon(i+1),interactive:false});mk.addTo(map);stopMks.push(mk);});}
      if(t.driver&&t.driver.lat!=null){if(!carMk)carMk=L.marker([t.driver.lat,t.driver.lng],{icon:L.divIcon({className:'',html:'<div style="width:40px;height:40px;border-radius:50%;background:#a855f7;display:grid;place-items:center;font-size:23px;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)">🚕</div>',iconSize:[40,40],iconAnchor:[20,20]}),interactive:false}).addTo(map);else glideTo(carMk,[t.driver.lat,t.driver.lng]);pts.push([t.driver.lat,t.driver.lng]);}
      if(pts.length){try{if(!fitted){fitted=true;map.flyToBounds(L.latLngBounds(pts).pad(0.3),{duration:0.8});}else if(t.driver&&t.driver.lat!=null&&map.getBounds&&!map.getBounds().contains([t.driver.lat,t.driver.lng])){map.panTo([t.driver.lat,t.driver.lng],{animate:true});}}catch(e){}}
      if(st==='COMPLETED'||st==='CANCELLED'){if(carMk){try{map.removeLayer(carMk);}catch(e){}carMk=null;}done=true;}
    }catch(e){document.getElementById('info').textContent='Sem ligação. A tentar de novo…';}
  }
  tick();setInterval(tick,4000);
})();
</script></body></html>
