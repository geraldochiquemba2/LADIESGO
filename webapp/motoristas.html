<!DOCTYPE html>
<html lang="pt">
<head>
<script>/* LadiesGo: /api/* -> Worker (Pages é estático; em localhost usa o server.js local) */
/* >> LADIESGO 2026-10-17: API movida para a CONTA CLOUDFLARE NOVA (subdominio ladiesgo-angola) porque a conta antiga (ladiesgo-ao) esgotou a quota diaria de Workers Free (erro 1027 / HTTP 429). VOLTAR AO NORMAL = trocar ladiesgo-api.ladiesgo-ao.workers.dev por ladiesgo-api.ladiesgo-ao.workers.dev e re-deployar o Pages. Ver cloudflare/README.md */
!function(){var A='https://ladiesgo-api.ladiesgo-ao.workers.dev',h=location.hostname;var o=window.fetch;window.fetch=function(u,x){try{if(typeof u==='string'){if(u.indexOf('/api/')===0)u=A+u;}else if(u instanceof Request){var p=new URL(u.url,location.href);if(p.origin===location.origin&&p.pathname.indexOf('/api/')===0)u=new Request(A+p.pathname+p.search,u);}}catch(e){}return o.call(this,u,x);};}();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5b21c9">
<title>LadiesGo! – Motoristas</title>
<style>
  :root{--b:#5b21c9;--b2:#61188E;--ink:#15111f;--mut:#6c6680;--ln:#ebe7f3;--bg:#f6f4fa;--ok:#12a150;--warn:#b45309;--red:#d92d4b}
  *{margin:0;box-sizing:border-box}
  body{background:var(--bg);overscroll-behavior:none;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);font-size:14px}
  header{position:sticky;top:0;z-index:500;background:linear-gradient(135deg,#61188E,#4a17a8);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:10px}
  header b{font-size:19px}header span{opacity:.75;font-size:12.5px;margin-left:8px}
  header .sp{flex:1}
  header a,header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:10px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
  h2{font-size:16px;margin:18px 0 10px}h2:first-child{margin-top:0}
  table{width:100%;background:#fff;border-radius:16px;overflow:hidden;border-collapse:collapse;box-shadow:0 2px 8px rgba(25,10,60,.07);border:1px solid #f1edf9}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--ln);font-size:13px;vertical-align:top}
  th{background:#faf8ff;color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
  tr:last-child td{border-bottom:0}
  tr.pick{cursor:pointer}tr.pick:hover td{background:#faf7ff}tr.pick.sel td{background:#ede9fe}
  tbody td[colspan]{text-align:center;color:var(--mut);padding:24px 14px;font-weight:600}
  .pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11.5px;font-weight:700}
  .on{background:#dcfce7;color:#166534}.off{background:#f1f0f6;color:#6c6680}
  .busy{background:#f3e8ff;color:#6b21a8}
  .mut{color:var(--mut)}.mono{font-variant-numeric:tabular-nums}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .filters input{border:1.5px solid var(--ln);border-radius:12px;padding:9px 12px;font:inherit;font-size:16px;background:#fff;flex:1;min-width:0}
  input{font-size:16px}
  .chip{border:1.5px solid var(--b);background:#fff;color:var(--b);border-radius:12px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer;min-height:38px}
  .chip:hover{background:#f3e8ff}.chip:active{transform:translateY(1px)}
  .edit{border:1.5px solid var(--ln);border-radius:14px;padding:14px;margin:10px 0;background:#fff;box-shadow:0 2px 8px rgba(25,10,60,.07)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .grid label{color:var(--mut);font-size:12px;font-weight:600}
  .grid input{width:100%;border:1.5px solid var(--ln);border-radius:10px;padding:8px 10px;font:inherit}
  .avrow{display:flex;align-items:center;gap:10px;margin:10px 0 4px}
  .av{width:54px;height:54px;border-radius:50%;overflow:hidden;background:#f3e6ff;display:grid;place-items:center;font-weight:800;color:#61188E;font-size:22px;flex:none}
  .av img{width:100%;height:100%;object-fit:cover}
  .dl{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;margin-top:10px}
  .dl>div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px dashed var(--ln);padding:5px 0}
  .dl .mut{font-size:12.5px}
  @media(max-width:640px){.dl{grid-template-columns:1fr}}
  .link{color:#61188E;font-weight:700;text-decoration:underline;cursor:pointer;font-size:13px}
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:700;background:#2a0c58;color:#fff;font-weight:700;font-size:14px;padding:12px 20px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:90vw;text-align:center}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.ok{background:#12a150}#toast.err{background:#d92d4b}
  @media(max-width:640px){table,thead,tbody,th,td,tr{display:block}thead{display:none}td{border:0;padding:4px 14px}tr{border-bottom:1px solid var(--ln);padding:6px 0}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><b>🦋 LadiesGo!</b><span>Motoristas</span><span class="sp"></span><a href="/admin">← Painel</a></header>
<div class="wrap">
  <div id="listSec">
    <h2>Motoristas</h2>
    <div class="filters"><input id="q" placeholder="Pesquisar motorista, viatura ou matrícula…"></div>
    <table><thead><tr><th>Nome</th><th>Viatura</th><th>Categorias</th><th>Estado</th><th></th></tr></thead><tbody id="list"><tr><td colspan="5">A carregar…</td></tr></tbody></table>
  </div>
  <div id="backSec" style="display:none"><button class="chip" id="backBtn">← Voltar à lista</button></div>
  <div id="editBox"></div>
  <div id="tripsBox"></div>
</div>
<div id="toast"></div>
<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var fmt=function(v){return String(Math.round(v||0)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');};
  var esc=function(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');};
  var dstr=function(s){try{if(!s)return '';var d=new Date(s);if(isNaN(d.getTime()))return '';return d.toLocaleString('pt-PT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}catch(e){return '';}};
  var ST_PT={PENDING:'Pendente',ACCEPTED:'Aceite',DRIVER_ARRIVED:'A caminho',ARRIVED:'No local',IN_PROGRESS:'Em curso',COMPLETED:'Concluída',CANCELLED:'Cancelada'};
  function normTripT(t){var pN=(t.passenger&&(t.passenger.name||t.passenger.phone))||t.passenger||'';return {id:t.id,driverId:t.driverId,passenger:pN,from:t.pickupAddress||t.from||'',to:t.dropoffAddress||t.to||'',fare:(t.finalFare!=null?t.finalFare:(t.fareEstimate!=null?t.fareEstimate:(t.fare||0))),status:String(t.status||'').toUpperCase(),ts:t.createdAt||t.ts||0};}
  var ah=function(){try{var t=localStorage.getItem('taxi_token');return t?{Authorization:'Bearer '+t}:{}}catch(e){return{};}};
  function toast(m,ok){try{var t=$('toast');t.textContent=m;t.className=ok===false?'err':(ok==='ok'?'ok':'');requestAnimationFrame(function(){t.classList.add('on');});clearTimeout(t._x);t._x=setTimeout(function(){t.classList.remove('on');},2600);}catch(e){}}
  function resizePhoto(file,max,q){return new Promise(function(res,rej){try{var rd=new FileReader();rd.onload=function(){var im=new Image();im.onload=function(){try{var sc=Math.min(1,max/Math.max(im.width,im.height));var cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(im.width*sc));cv.height=Math.max(1,Math.round(im.height*sc));cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',q||0.9));}catch(e){rej(e)}};im.onerror=function(){rej(new Error('img'))};im.src=rd.result;};rd.onerror=rej;rd.readAsDataURL(file);}catch(e){rej(e)}})}

  var DRV=[],DSTATS=[],BUSY={},ALLT=[],FILTER='',selDrv=null,dFrom='',dTo='';

  function normD(d){
    return {id:d.id,userId:d.userId,name:d.name||'',phone:d.phone||'',carMake:d.carMake||'',carModel:d.carModel||'',carYear:d.carYear,carColor:d.carColor||'',carPlate:d.carPlate||'',licenseNumber:d.licenseNumber||'',cats:d.cats||[],isOnline:(d.isOnline===true||d.isOnline===1),liveLat:(d.currentLat!=null?Number(d.currentLat):null),liveLng:(d.currentLng!=null?Number(d.currentLng):null),photo:d.profilePhoto||d.carPhoto||'',profilePhoto:d.profilePhoto||'',updatedAt:d.updatedAt||'',userActive:(d.userActive===true||d.userActive===1)};
  }

  async function load(){
    try{
      var r1=await fetch('/api/v1/admin/drivers',{headers:ah()});
      if(r1.status===401)throw new Error('sessao');
      var j1=await r1.json();
      DRV=((j1.drivers)||[]).map(normD);
      var r2=await fetch('/api/v1/admin/driver-stats',{headers:ah()});
      var j2=await r2.json();
      DSTATS=((j2.driverStats)||[]);
      try{
        var r3=await fetch('/api/v1/admin/trips?limit=200',{headers:ah()});
        var j3=await r3.json();
        ALLT=((j3.trips)||[]).map(normTripT);
        BUSY={};
        ALLT.forEach(function(t){var s=String(t.status||'').toUpperCase();if((s==='ACCEPTED'||s==='DRIVER_ARRIVED'||s==='IN_PROGRESS'||s==='ARRIVED')&&t.driverId)BUSY[t.driverId]=1;});
      }catch(e){}
      renderList();renderForm();
      try{var dp=new URLSearchParams(location.search).get('drv');if(dp){selDrv=dp;renderList();renderForm();}}catch(e){}
    }catch(e){
      if((e&&e.message)==='sessao'){toast('Sessão expirada. Entra no painel.',false);setTimeout(function(){location.href='/admin';},1200);return;}
      $('list').innerHTML='<tr><td colspan="5">Falhou a carregar. Verifica a ligação.</td></tr>';
    }
  }

  function renderList(){
    var q=(FILTER||'').toLowerCase();
    var list=DRV.filter(function(x){if(!q)return true;return ((x.name||'')+' '+(x.carMake||'')+' '+(x.carModel||'')+' '+(x.carPlate||'')).toLowerCase().indexOf(q)>=0;});
    $('list').innerHTML=list.map(function(x){
      var viat=([x.carMake,x.carModel].filter(Boolean).join(' ')+((x.carColor?' · '+x.carColor:'')).trim());
      var viatTxt=((viat||'')+(x.carPlate?' · '+x.carPlate:'')).trim()||'—';
      var est=BUSY[x.id]?'<span class="pill busy">Em viagem</span>':(x.isOnline?'<span class="pill on">Online</span>':'<span class="pill off">Offline</span>');
      return '<tr data-drv="'+esc(x.id)+'" class="pick'+(x.id===selDrv?' sel':'')+'"><td><b>'+esc(x.name)+'</b>'+(x.phone?'<br><span class="mut">'+esc(x.phone)+'</span>':'')+'</td><td>'+esc(viatTxt)+'</td><td>'+esc((x.cats||[]).join(', ')||'—')+'</td><td>'+est+'</td><td><button class="chip" data-edit="'+esc(x.id)+'">Editar</button></td></tr>';
    }).join('')||'<tr><td colspan="5">Nenhuma motorista.</td></tr>';
  }

  function renderForm(){
    var box=$('editBox'),tb=$('tripsBox');
    if(tb)tb.innerHTML='';
    try{var ls=$('listSec'),bs=$('backSec');if(ls)ls.style.display=selDrv?'none':'';if(bs)bs.style.display=selDrv?'':'none';}catch(e){}
    if(!selDrv){if(box)box.innerHTML='';return;}
    var live=null;
    for(var i=0;i<DRV.length;i++){if(DRV[i].id===selDrv){live=DRV[i];break;}}
    if(!live){box.innerHTML='<div class="edit mut">Motorista não encontrada.</div>';return;}
    var st={total:0,completed:0,cancelled:0,revenue:0};
    for(var s=0;s<DSTATS.length;s++){if(DSTATS[s].driverId===selDrv){st=DSTATS[s];break;}}
    var isBusy=!!BUSY[live.id];
    var estado=isBusy?'<span class="pill busy">Em viagem</span>':(live.isOnline?'<span class="pill on">Online</span>':'<span class="pill off">Offline</span>');
    var init=((live.name||'?').trim()[0]||'?').toUpperCase();
    var viat=([live.carMake,live.carModel].filter(Boolean).join(' ')+(live.carYear?' · '+live.carYear:'')+(live.carColor?' · '+live.carColor:'')+(live.carPlate?' · '+live.carPlate:'')).trim()||'—';
    var pos=(live.liveLat!=null?live.liveLat.toFixed(4):'—')+', '+(live.liveLng!=null?live.liveLng.toFixed(4):'—');
    box.innerHTML='<div class="edit">'
      +'<h2 style="margin-top:0">Detalhes</h2>'
      +'<div class="avrow"><div class="av">'+(live.photo?'<img src="'+esc(live.photo)+'" alt="">':esc(init))+'</div>'
      +'<div><b style="font-size:16px">'+esc(live.name)+'</b><div style="margin:2px 0">'+estado+'</div>'+(live.phone?'<div class="mut">'+esc(live.phone)+'</div>':'')+'</div></div>'
      +'<div class="dl">'
      +'<div><span class="mut">Viatura</span><b>'+esc(viat)+'</b></div>'
      +'<div><span class="mut">Categorias</span><b>'+esc((live.cats||[]).join(', ')||'—')+'</b></div>'
      +'<div><span class="mut">Carta</span><b>'+esc(live.licenseNumber||'—')+'</b></div>'
      +'<div><span class="mut">Posição</span><b class="mono">'+esc(pos)+'</b></div>'
      +'<div><span class="mut">Atualizado</span><b>'+esc(dstr(live.updatedAt)||'—')+'</b></div>'
      +'<div><span class="mut">Viagens</span><b>'+Number(st.total||0)+' · '+Number(st.completed||0)+' concl. · '+Number(st.cancelled||0)+' canc.</b></div>'
      +'<div><span class="mut">Bruto (pago)</span><b class="mono">'+fmt(st.revenue)+' Kz</b></div>'
      +'<div><span class="mut">Ganhos da motorista (86%)</span><b class="mono" style="color:#0d9488">'+fmt(st.revenue*0.86)+' Kz</b></div>'
      +'<div><span class="mut">Comissão LadiesGo (14%)</span><b class="mono" style="color:#61188E">'+fmt(st.revenue*0.14)+' Kz</b></div>'
      +'<div><span class="mut">Conta de acesso</span><b>'+(live.userActive===false?'<span style="color:#d92d4b">Inativa — não consegue entrar</span>':'<span style="color:#0d9488">Ativa</span>')+'</b></div>'
      +'</div>'
      +'<div style="margin-top:10px"><button class="chip" data-a="resetpw" data-id="'+esc(live.userId||'')+'" data-n="'+esc(live.name||'')+'">🔑 Repor senha'+(live.userActive===false?' e reativar conta':'')+' (0987654321)</button> <span class="mut" id="pwMsg" style="font-size:12.5px"></span></div>'
      +'</div>'
      +'<div class="edit"><h2 style="margin-top:0">Editar motorista e viatura</h2>'
      +'<div class="grid">'
      +'<label>Nome<input id="edName" value="'+esc(live.name)+'" maxlength="60"></label>'
      +'<label>Marca<input id="edMake" value="'+esc(live.carMake)+'" maxlength="40"></label>'
      +'<label>Modelo<input id="edModel" value="'+esc(live.carModel)+'" maxlength="40"></label>'
      +'<label>Ano<input id="edYear" value="'+esc(live.carYear!=null?String(live.carYear):'')+'" maxlength="4" inputmode="numeric"></label>'
      +'<label>Cor<input id="edColor" value="'+esc(live.carColor)+'" maxlength="20"></label>'
      +'<label>Matrícula<input id="edPlate" value="'+esc(live.carPlate)+'" maxlength="12"></label>'
      +'<label>Carta<input id="edLic" value="'+esc(live.licenseNumber)+'" maxlength="30"></label>'
      +'</div>'
      +'<div class="avrow"><div class="av" id="edPhotoPrev">'+(live.photo?'<img src="'+esc(live.photo)+'" alt="">':esc(init))+'</div>'
      +'<div><label for="edPhoto" class="link">Mudar foto</label><input id="edPhoto" type="file" accept="image/*" data-photo-user="'+esc(live.userId||'')+'" style="display:none"><div class="mut" id="edPhotoMsg" style="font-size:12.5px"></div></div></div>'
      +'<div style="margin-top:8px"><button class="chip" data-a="savedrv">Guardar</button> <span class="mut" id="edMsg" style="font-size:12.5px"></span></div>'
      +'</div>';
    renderTrips();
  }

  function driverTrips(){return ALLT.filter(function(t){return t.driverId===selDrv;}).sort(function(a,b){return ((b.ts||0)-(a.ts||0));});}
  function withinDate(t,from,to){var ts=t.ts?new Date(t.ts).getTime():0;if(from){var f=new Date(from+'T00:00:00').getTime();if(ts&&ts<f)return false;}if(to){var e=new Date(to+'T23:59:59').getTime();if(ts&&ts>e)return false;}return true;}
  function renderTrips(){
    var tb=$('tripsBox');if(!tb)return;
    if(!selDrv){tb.innerHTML='';return;}
    var all=driverTrips();
    var list=all.filter(function(t){return withinDate(t,dFrom,dTo);});
    var rows=list.slice(0,50).map(function(t){return '<tr><td class="mut">'+esc(dstr(t.ts)||'—')+'</td><td><b>'+esc(t.passenger||'—')+'</b></td><td class="mut">'+esc(t.from||'')+(t.to?' → '+esc(String(t.to).split(' · ')[0]):'')+'</td><td class="mono">'+fmt(t.fare)+' Kz</td><td><span class="pill off">'+esc(ST_PT[t.status]||t.status||'')+'</span></td><td><button class="chip" data-a="tripprog" data-id="'+esc(t.id)+'">Ver progresso</button></td></tr>';}).join('');
    var body=rows||'<tr><td colspan="6">Sem viagens no período.</td></tr>';
    var tbody=$('tripsTbody');
    if(tbody){
      tbody.innerHTML=body;
      var fi=$('tripsFrom'),ti=$('tripsTo');if(fi)fi.value=dFrom;if(ti)ti.value=dTo;
      var c=$('tripsCount');if(c)c.textContent=list.length+' de '+all.length;
      return;
    }
    tb.innerHTML='<h2>Viagens da motorista</h2>'
      +'<div class="filters"><label class="mut" style="font-size:12.5px;align-self:center">De <input type="date" id="tripsFrom" value="'+esc(dFrom)+'"></label><label class="mut" style="font-size:12.5px;align-self:center">Até <input type="date" id="tripsTo" value="'+esc(dTo)+'"></label><button class="chip" data-a="tclear">Limpar</button><span class="mut" id="tripsCount" style="align-self:center;font-size:12.5px">'+list.length+' de '+all.length+'</span></div>'
      +'<table><thead><tr><th>Quando</th><th>Passageira</th><th>Rota</th><th>Preço</th><th>Estado</th><th></th></tr></thead><tbody id="tripsTbody">'+body+'</tbody></table>';
  }

  async function save(){
    if(!selDrv)return;
    var g=function(id){var el=$(id);return el?((el.value||'').trim()):'';};
    var bd={name:g('edName'),carMake:g('edMake'),carModel:g('edModel'),carYear:g('edYear'),carColor:g('edColor'),carPlate:g('edPlate'),licenseNumber:g('edLic')};
    var m=$('edMsg'),say=function(x){if(m)m.textContent=x;};
    if(bd.carYear){var yy=parseInt(bd.carYear,10);if(!Number.isInteger(yy)||yy<1990||yy>new Date().getFullYear()+1){say('Ano inválido.');return;}}
    say('A guardar…');
    try{
      var r=await fetch('/api/v1/admin/drivers/'+selDrv,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ah()),body:JSON.stringify(bd)});
      var j=await r.json().catch(function(){return null;});
      if(!r.ok)throw new Error((j&&j.message)||'Falhou');
      say('Guardado ✓');toast('Motorista atualizada ✓','ok');load();
    }catch(e){say('Erro: '+((e&&e.message)||e));}
  }

  async function savePhoto(userId,file){
    var m=$('edPhotoMsg'),say=function(x){if(m)m.textContent=x;};
    if(!userId){say('Conta inválida.');return;}
    if(!file)return;
    if(file.size>8*1024*1024){say('Foto até 8 MB.');return;}
    say('A preparar…');
    try{
      var dataUrl=await resizePhoto(file,720,0.9);
      say('A guardar…');
      var r=await fetch('/api/v1/admin/users/'+encodeURIComponent(userId)+'/photo',{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ah()),body:JSON.stringify({photo:dataUrl})});
      var j=await r.json().catch(function(){return null;});
      if(!r.ok)throw new Error((j&&j.message)||'Falhou.');
      say('Foto atualizada');toast('Foto atualizada','ok');
      var pv=$('edPhotoPrev');if(pv)pv.innerHTML='<img src="'+dataUrl+'" alt="">';
      for(var i=0;i<DRV.length;i++){if(DRV[i].userId===userId)DRV[i].photo=dataUrl;}
    }catch(e){say('Erro: '+((e&&e.message)||e));toast('Falhou a foto.',false);}
  }

  document.addEventListener('click',function(e){
    var bk=e.target.closest&&e.target.closest('#backBtn');
    if(bk){e.preventDefault();selDrv=null;renderList();renderForm();window.scrollTo({top:0,behavior:'smooth'});return;}
    var ed=e.target.closest&&e.target.closest('[data-edit]');
    if(ed){e.preventDefault();selDrv=ed.dataset.edit;renderList();renderForm();window.scrollTo({top:0,behavior:'smooth'});return;}
    var row=e.target.closest&&e.target.closest('tr[data-drv]');
    if(row){selDrv=row.dataset.drv;renderList();renderForm();return;}
    var sv=e.target.closest&&e.target.closest('[data-a="savedrv"]');
    if(sv){e.preventDefault();save();return;}
    var rs=e.target.closest&&e.target.closest('[data-a="resetpw"]');
    if(rs){e.preventDefault();
      var uid=rs.dataset.id||'';
      if(!uid){var m0=$('pwMsg');if(m0)m0.textContent='Sem conta associada.';return;}
      if(!confirm('Repor a senha de '+(rs.dataset.n||'esta motorista')+' para a padrão 0987654321?'))return;
      var say=function(x){var m=$('pwMsg');if(m)m.textContent=x;};
      rs.disabled=true;say('A repor…');
      fetch('/api/v1/admin/users/'+encodeURIComponent(uid)+'/reset-password',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},ah())})
        .then(function(r){return r.json().then(function(j){return{r:r,j:j}})})
        .then(function(o){if(!o.r.ok)throw new Error((o.j&&o.j.message)||'Falhou');say('Senha reposta e conta ativada ✓');toast('Senha reposta para 0987654321 · conta ativada ✓','ok');setTimeout(function(){load();},800);})
        .catch(function(err){say('Erro: '+((err&&err.message)||err));toast('Falhou o reset.',false);})
        .then(function(){rs.disabled=false;});
      return;
    }
    var pp=e.target.closest&&e.target.closest('[data-a="tripprog"]');
    if(pp){e.preventDefault();try{var _id=pp.dataset.id||'';if(_id)window.open('/t?id='+encodeURIComponent(_id),'_blank','noopener');}catch(err){}return;}
    var tc=e.target.closest&&e.target.closest('[data-a="tclear"]');
    if(tc){e.preventDefault();dFrom='';dTo='';renderTrips();return;}
  });
  document.addEventListener('input',function(e){if(e.target&&e.target.id==='q'){FILTER=e.target.value||'';renderList();}else if(e.target&&e.target.id==='tripsFrom'){dFrom=e.target.value||'';renderTrips();}else if(e.target&&e.target.id==='tripsTo'){dTo=e.target.value||'';renderTrips();}});
  document.addEventListener('change',function(e){if(e.target&&e.target.id==='edPhoto'){savePhoto(e.target.dataset.photoUser,e.target.files&&e.target.files[0]);e.target.value='';}else if(e.target&&e.target.id==='tripsFrom'){dFrom=e.target.value||'';renderTrips();}else if(e.target&&e.target.id==='tripsTo'){dTo=e.target.value||'';renderTrips();}});

  load();
})();
</script>
