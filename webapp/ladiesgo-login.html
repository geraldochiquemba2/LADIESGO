<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LadiesGo! – App de táxi para mulheres</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--p:#6a2bd6;--p2:#a45bf5;--pk:#ff5fc8;--ink:#2a0c58;--soft:#f3e6ff}
  *{margin:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:#12052a;font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;color:var(--ink)}
  button{font:inherit;border:0;cursor:pointer;color:inherit;background:none}
  button:focus-visible{outline:3px solid var(--pk);outline-offset:2px}
  .app{position:relative;max-width:440px;height:100dvh;margin:auto;display:flex;flex-direction:column;overflow:hidden;background:#1b0a3c}
  @media(min-width:900px){.app{max-width:none;flex-direction:row}.scene{flex:1.4}.card{width:430px;flex:none;margin:0;border-radius:26px 0 0 26px;height:100dvh;overflow-y:auto;box-shadow:-10px 0 30px rgba(20,0,50,.35)}.modal .card{max-width:460px;margin:0 0 0 auto}}
  .scene{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:flex-end;overflow:hidden}
  #scene{width:100%;height:100%;display:block}
  .top{position:absolute;z-index:5;top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;right:14px;display:flex;justify-content:space-between;align-items:center}
  .brand{display:flex;align-items:center;gap:6px;font-size:28px;font-weight:800;color:#fff;-webkit-text-stroke:2px #4a1a8f;paint-order:stroke fill;text-shadow:0 3px 12px rgba(0,0,0,.4)}
  .brand svg{width:38px}
  
  .fly{position:absolute;left:0;z-index:2;animation:fly 17s linear infinite}
  @keyframes fly{0%{transform:translate(-50px,0) rotate(8deg)}25%{transform:translate(110px,-36px) rotate(-8deg)}50%{transform:translate(220px,18px) rotate(10deg)}75%{transform:translate(330px,-28px) rotate(-6deg)}100%{transform:translate(500px,6px) rotate(6deg)}}
  .fly svg{width:100%;display:block}
  .wl,.wr{transform-box:fill-box;animation:flap .3s ease-in-out infinite alternate}.wl{transform-origin:100% 50%}.wr{transform-origin:0 50%}
  @keyframes flap{to{transform:scaleX(.25)}}
  .win{fill:#ffd9f4;animation:tw 4s ease-in-out infinite}.st{fill:#fff;animation:tw 3s ease-in-out infinite}.cloud{animation:drift 9s ease-in-out infinite alternate}@keyframes drift{from{transform:translateX(-9px)}to{transform:translateX(11px)}}
  @keyframes tw{0%,100%{opacity:.12}50%{opacity:1}}
  .pony{transform-box:fill-box;transform-origin:50% 0;animation:sway .7s ease-in-out infinite alternate}
  @keyframes sway{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
  #beam{animation:pulse 3s ease-in-out infinite}@keyframes pulse{50%{opacity:.7}}
  .glow{animation:fl 3.5s ease-in-out infinite}@keyframes fl{50%{opacity:.65}}
  .ring{fill:none;stroke:#ff8fe0;stroke-width:1.5;transform-box:fill-box;transform-origin:center;opacity:0;animation:ring 2s ease-out infinite}
  .ring:nth-child(2){animation-delay:.66s}.ring:nth-child(3){animation-delay:1.33s}
  @keyframes ring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(5);opacity:0}}
  #pop{opacity:0;font-size:14px}#pop.go{animation:pop 1.6s ease-out}
  @keyframes pop{0%{opacity:0;transform:translateY(0) scale(.4)}20%{opacity:1;transform:translateY(-8px) scale(1.2)}100%{opacity:0;transform:translateY(-34px)}}
  /* cartão */
  .card{position:relative;z-index:4;margin-top:-20px;background:#fdf6ff;border-radius:26px 26px 0 0;padding:16px 18px calc(env(safe-area-inset-bottom,0px) + 12px);box-shadow:0 -10px 30px rgba(20,0,50,.35);overflow-y:auto}
  .card.swap>*{animation:sw .45s ease both}@keyframes sw{from{opacity:0;transform:translateY(10px)}}
  h2{font-size:21px;font-weight:800;line-height:1.1}.mut{font-size:13.5px;color:#6b4a9a;font-weight:500}
  .field{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid #e3d0f8;border-radius:16px;padding:10px 14px;margin:10px 0;font-weight:700}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .chip{background:var(--soft);border-radius:99px;padding:5px 13px;font-weight:700;font-size:14px;border:2px solid transparent}.chip.sel{border-color:var(--p);background:#fff}
  .cta{width:100%;height:52px;border-radius:16px;font-size:18px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--p2),var(--p));box-shadow:0 8px 20px rgba(106,43,214,.4);animation:btn 2.4s ease-in-out infinite}
  @keyframes btn{50%{transform:scale(1.02)}}.cta:active{transform:scale(.98)}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid #eadbfa;border-radius:16px;padding:8px 12px;margin-bottom:7px}
  .opt.sel{border-color:var(--p);box-shadow:0 0 0 3px rgba(164,91,245,.2)}.opt b{font-size:16px;display:block;line-height:1.1}.opt .pr{margin-left:auto;font-weight:800}
  .ico{flex:none;width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:21px}
  .tabs{display:flex;justify-content:space-around;margin-top:10px;padding-top:8px;border-top:1px solid #ead9fa;font-size:12px;font-weight:700;color:#8a68b8}
  .tabs button{display:flex;flex-direction:column;align-items:center}.tabs .a{color:var(--p)}.tabs i{font-style:normal;font-size:19px}
  .row{display:flex;align-items:center;gap:12px}.av{flex:none;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#c58cff,#6a2bd6);border:3px solid #fff;display:grid;place-items:center;font-size:24px;box-shadow:0 3px 10px rgba(106,43,214,.4)}
  .plate{background:#fff;border:2px solid var(--ink);border-radius:7px;padding:0 7px;font-weight:800;letter-spacing:1px;font-size:13px}
  .bar{height:7px;border-radius:9px;background:#e6d4fa;margin:11px 0 8px;overflow:hidden}.bar div{height:100%;width:0;background:linear-gradient(90deg,var(--pk),var(--p2))}
  .acts{display:flex;gap:8px;margin-top:10px}.acts button{flex:1;background:var(--soft);border-radius:14px;height:44px;font-weight:700;font-size:14px}
  .dots{display:flex;gap:6px;justify-content:center;margin:14px 0}.dots i{width:10px;height:10px;border-radius:50%;background:var(--p2);animation:dot 1s infinite}
  .dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}@keyframes dot{50%{transform:translateY(-8px);opacity:.4}}
  .stars{display:flex;justify-content:center;gap:6px;margin:8px 0}.stars button{font-size:34px;color:#dcc6f5;transition:transform .2s}.stars button.on{color:#ffb400;transform:scale(1.15)}
  .ct{text-align:center}
  .login-head{text-align:center;margin-bottom:4px}.login-head h2{font-size:24px}.login-head .mut{margin-top:4px}
  .flabel{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#8a68b8;margin:12px 0 5px}
  .login-err{min-height:20px;text-align:center;font-size:13px;font-weight:700;color:#c2185b;margin:10px 0 6px}
  .login-guest{display:block;width:100%;text-align:center;margin-top:6px;font-weight:700;font-size:14.5px;color:#6a2bd6;padding:10px}
  .login-wrap{display:flex;flex-direction:column;justify-content:flex-start;min-height:100%}
  .cta-ghost{background:#fff;color:#6a2bd6;border:2px solid #e3d0f8;box-shadow:none;margin-top:10px;animation:none}
  .splash{position:absolute;inset:0;z-index:20;background:radial-gradient(circle at 50% 40%,#8a3fe0,#3a1170);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .7s,visibility .7s}
  .splash.off{opacity:0;visibility:hidden}.splash svg{width:120px;animation:hov 2s ease-in-out infinite}
  .splash h1{font-size:54px;font-weight:800;-webkit-text-stroke:3px #4a1a8f;paint-order:stroke fill}
  @keyframes hov{50%{transform:translateY(-10px)}}
  .modal{position:absolute;inset:0;z-index:15;background:rgba(20,0,50,.6);display:none;align-items:flex-end}.modal.on{display:flex}
  .modal .card{margin:0;width:100%}.red{background:linear-gradient(135deg,#ff5c8f,#e01e5a)}
  .tmodal{position:absolute;inset:0;z-index:25;background:rgba(20,0,50,.65);display:none;align-items:center;justify-content:center;padding:20px}
  .tmodal.on{display:flex}
  .tbox{position:relative;background:#fff;border-radius:20px;padding:26px 18px 18px;max-width:420px;width:100%;max-height:82%;overflow-y:auto;font-size:13.5px;line-height:1.6}
  .tx{position:absolute;top:8px;right:10px;width:34px;height:34px;border-radius:50%;background:var(--soft);font-weight:800;font-size:15px}
  @media (prefers-reduced-motion:reduce){.fly,.wl,.wr,.win,.st,.pony,.cta{animation:none}}html{-webkit-text-size-adjust:100%}input,select,textarea{font-size:16px !important}
</style>
</head>
<body>
<div class="app">
  <div class="scene" id="sceneBox">
    <div class="top"><div class="brand" id="logo"></div></div>
    <svg id="scene" viewBox="0 -150 400 450" preserveAspectRatio="xMidYMax slice" aria-label="Cidade animada com táxi LadiesGo">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b0a3c"/><stop offset=".55" stop-color="#4b1a8f"/><stop offset=".85" stop-color="#b048cf"/><stop offset="1" stop-color="#ff9ad5"/></linearGradient>
        <linearGradient id="beamG" x1="0" x2="1"><stop offset="0" stop-color="#fff3b8" stop-opacity=".6"/><stop offset="1" stop-color="#fff3b8" stop-opacity="0"/></linearGradient>
        <radialGradient id="glow"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".8"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/></radialGradient>
        <linearGradient id="skyDay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2a6e"/><stop offset=".45" stop-color="#a34d7e"/><stop offset=".75" stop-color="#ff7e47"/><stop offset="1" stop-color="#ffc46b"/></linearGradient><linearGradient id="seamG" x1="0" x2="1"><stop offset="0" stop-color="#ffe9b4" stop-opacity="0"/><stop offset=".5" stop-color="#ffe9b4" stop-opacity=".55"/><stop offset="1" stop-color="#ffe9b4" stop-opacity="0"/></linearGradient><radialGradient id="moon"><stop offset=".4" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
      </defs>
      <rect x="0" y="-150" width="400" height="450" fill="url(#sky)"/><rect x="195" y="-150" width="205" height="450" fill="url(#skyDay)"/><rect x="160" y="-150" width="70" height="348" fill="url(#seamG)"/><g id="stars"></g><g id="daySide"><circle cx="308" cy="105" r="52" fill="url(#glow)"/><circle cx="308" cy="105" r="18" fill="#ffe3b3"/><circle cx="308" cy="105" r="12" fill="#ff8c42"/><g class="cloud" opacity=".85" fill="#ffcfb0"><ellipse cx="348" cy="-108" rx="26" ry="9"/><ellipse cx="328" cy="-113" rx="20" ry="8"/><ellipse cx="250" cy="-46" rx="24" ry="8"/><ellipse cx="232" cy="-51" rx="17" ry="7"/></g><g class="cloud" style="animation-duration:13s" opacity=".7" fill="#ffb38a"><ellipse cx="280" cy="-128" rx="18" ry="7"/><ellipse cx="266" cy="-131" rx="13" ry="6"/></g></g>
      <circle cx="78" cy="-58" r="34" fill="url(#moon)"/><circle cx="78" cy="-58" r="14" fill="#fff6fc"/>
      <g id="L1"></g><g id="L2"></g>
      <rect y="198" width="400" height="30" fill="#3d1680"/><rect y="226" width="400" height="3" fill="#6a3bb5"/>
      <g id="L3"></g><g id="woman"></g>
      <rect y="229" width="400" height="71" fill="#22093f"/><g id="L4"></g><g id="A"></g>
      <g id="T">
        <ellipse cx="62" cy="50" rx="64" ry="4" fill="#000" opacity=".4"/>
        <path id="beam" d="M121 31L300 4V58Z" fill="url(#beamG)"/>
        <path d="M2 38V30Q2 26 10 25L30 22Q38 9 54 9H86Q98 9 106 22L116 26Q122 28 122 34V38Q122 40 120 40H2Z" fill="#8a45ea" stroke="#5a22ab" stroke-width="1.2"/>
        <path d="M2 32H121" stroke="#ff8fe0" stroke-width="2"/>
        <path d="M36 22Q42 12 54 12H64V22ZM69 12H85Q93 12 100 22H69Z" fill="#bfe0ff"/><path d="M66 12V38" stroke="#5a22ab" opacity=".5"/>
        <g id="pax" display="none"><circle cx="50" cy="18" r="4.5" fill="#e8b48e"/><path d="M45 18Q44 11 50 11Q56 11 55 18Q54 14 50 14Q47 14 45 18Z" fill="#2a120c"/></g>
        <circle cx="85" cy="18" r="4.5" fill="#c98f66"/><path d="M80 18Q79 11 85 11Q91 11 90 18Q89 14 85 14Q82 14 80 18Z" fill="#1c0d0a"/><ellipse class="pony" cx="79" cy="18" rx="2" ry="5" fill="#1c0d0a"/>
        <rect x="58" y="-1" width="34" height="9" rx="2.5" fill="#ff5fc8"/><text x="75" y="6" font-size="5.6" font-weight="800" fill="#fff" text-anchor="middle">LADIESGO</text>
        <circle cx="119" cy="31" r="3" fill="#fff3b8"/><rect y="30" width="3" height="4" fill="#ff4d6d"/>
        <g id="wB"><circle r="9" fill="#15062e"/><circle r="5" fill="#d9b8ff"/><path d="M-4 0H4M0-4V4" stroke="#5a22ab" stroke-width="1.4"/></g>
        <g id="wF"><circle r="9" fill="#15062e"/><circle r="5" fill="#d9b8ff"/><path d="M-4 0H4M0-4V4" stroke="#5a22ab" stroke-width="1.4"/></g>
        <text id="pop" x="52" y="-4" text-anchor="middle">💜</text>
      </g>
    </svg>
  </div>
  <section class="card" id="card"></section>
  <div class="tmodal" id="tmodal"><div class="tbox"><button class="tx" data-a="close-terms" aria-label="Fechar">✕</button><div id="tbody"></div></div></div>
  <div class="modal" id="sos"><div class="card">
    <h2>🛡 Centro de segurança</h2><p class="mut">Escolhe uma ação. Podes voltar quando quiseres.</p><div style="height:12px"></div>
    <button class="cta red" style="margin-bottom:8px">Ligar para a emergência</button>
    <button class="cta" style="margin-bottom:8px">Alertar contactos de confiança</button>
    <button class="chip" data-a="close" style="width:100%;height:42px">Estou bem, voltar</button></div></div>
  <div class="splash" id="splash"><div id="sl" style="width:120px"></div><h1>LadiesGo!</h1><p>Mobilidade Feminina Segura</p></div>
</div>

<script>
const $=id=>document.getElementById(id),lerp=(a,b,k)=>a+(b-a)*k;
let seed=7;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
const wing='M20 14C15 2 3 2 3 9C3 15 11 18 20 17ZM20 18C13 19 9 24 12 27C15 30 19 25 20 22Z';
const bf=c=>`<svg viewBox="0 0 40 30"><g class="wl"><path d="${wing}" fill="${c}" stroke="#fff" stroke-width="1.2"/></g><g class="wr"><path transform="translate(40 0) scale(-1 1)" d="${wing}" fill="${c}" stroke="#fff" stroke-width="1.2"/></g><rect x="19" y="10" width="2" height="16" rx="1" fill="#3a1470"/></svg>`;
$('logo').innerHTML=bf('#b070ff')+'LadiesGo!';$('sl').innerHTML=bf('#d9a8ff');
setTimeout(()=>$('splash').classList.add('off'),2400);
[['#ff9ad5',22,'26%',0],['#d9a8ff',30,'40%',-7],['#ffd0f0',18,'14%',-12]].forEach(([c,w,top,d])=>{const e=document.createElement('div');e.className='fly';e.style.cssText=`width:${w}px;top:${top};animation-delay:${d}s;animation-duration:${16+w/3}s`;e.innerHTML=bf(c);$('sceneBox').appendChild(e)});

/* cidade */
function tile(base,hmin,hmax,col,win){let x=0,s='';while(x<400){let w=Math.min(16+rnd()*26,400-x);if(400-x-w<14)w=400-x;const h=hmin+rnd()*(hmax-hmin);s+=`<rect x="${x}" y="${base-h}" width="${w+.5}" height="${h}" fill="${col}"/>`;
  if(win)for(let wy=base-h+6;wy<base-6;wy+=9)for(let wx=x+4;wx<x+w-6;wx+=8)if(rnd()<.3)s+=`<rect class="win" x="${wx}" y="${wy}" width="3" height="4" style="animation-delay:${(rnd()*5).toFixed(1)}s"/>`;x+=w}return s}
const dup=(id,s)=>$(id).innerHTML=s+`<g transform="translate(400)">${s}</g>`;
dup('L1',tile(198,50,120,'#3a1275'));dup('L2',tile(198,25,75,'#2a0c58',1));
const lamp=x=>`<rect x="${x-1}" y="156" width="2.4" height="72" fill="#1a0838"/><path d="M${x} 158H${x+12}" stroke="#1a0838" stroke-width="2.4"/><circle class="glow" cx="${x+12}" cy="162" r="22" fill="url(#glow)"/><circle cx="${x+12}" cy="160" r="2.6" fill="#fff6c8"/>`;
const bush=x=>`<ellipse cx="${x}" cy="222" rx="14" ry="8" fill="#2f1163"/><ellipse cx="${x+9}" cy="220" rx="10" ry="7" fill="#3a1680"/>`;
dup('L3',lamp(70)+lamp(330)+bush(170)+bush(390));
let d='';for(let i=0;i<8;i++)d+=`<rect x="${i*50+10}" y="282" width="26" height="3" rx="1.5" fill="#d9b8ff" opacity=".55"/>`;dup('L4',d);
let st='';for(let i=0;i<70;i++)st+=`<circle class="st" cx="${(5+rnd()*185).toFixed(0)}" cy="${(-150+rnd()*190).toFixed(0)}" r="${(.5+rnd()*1.1).toFixed(1)}" style="animation-delay:${(rnd()*4).toFixed(1)}s"/>`;$('stars').innerHTML=st;

/* trânsito ao fundo */
const BP='M2 38V30Q2 26 10 25L30 22Q38 9 54 9H86Q98 9 106 22L116 26Q122 28 122 34V38Q122 40 120 40H2Z';
const amb=[['#ff8fe0',1,34],['#5ac8fa',-1,46],['#ffd23f',1,52]].map(([c,dir,v],i)=>{const g=document.createElementNS('http://www.w3.org/2000/svg','g');
  g.innerHTML=`<path d="${BP}" fill="${c}" stroke="#2a0c58" stroke-width="1.5"/><path d="M36 22Q42 12 54 12H64V22ZM69 12H85Q93 12 100 22H69Z" fill="#bfe0ff"/><circle cx="26" cy="40" r="9" fill="#15062e"/><circle cx="96" cy="40" r="9" fill="#15062e"/><circle cx="119" cy="31" r="3" fill="#fff3b8"/><rect y="30" width="3" height="4" fill="#ff4d6d"/>`;
  $('A').appendChild(g);return{g,x:i*150-20,dir,v:dir*v}});

/* passageira */
function look(){$('woman').innerHTML=`<g id="wp"><g id="rg" display="none"><circle class="ring" cy="-22" r="8"/><circle class="ring" cy="-22" r="8"/><circle class="ring" cy="-22" r="8"/></g>
<g id="pin"><path d="M0-50L-5-58A6 6 0 1 1 5-58Z" fill="#ff5fc8" stroke="#fff"/><circle cy="-60" r="2" fill="#fff"/></g>
<g id="lg1"><line y2="16" stroke="#e8b48e" stroke-width="3" stroke-linecap="round"/></g><g id="lg2"><line y2="16" stroke="#e8b48e" stroke-width="3" stroke-linecap="round"/></g>
<path d="M-6-34H6L9-14H-9Z" fill="#ff5fc8"/><g id="arm"><line y2="10" stroke="#e8b48e" stroke-width="2.6" stroke-linecap="round"/></g>
<circle cy="-40" r="5" fill="#e8b48e"/><path d="M-5.4-40Q-6-47 0-47Q6-47 5.4-40Q7-34 3-31Q0-37-5.4-40Z" fill="#2a120c"/></g>`}look();

/* telas do app */
let dest='Trabalho',scr='',ph='home',t=0;
const stars=`<div class="stars">${[1,2,3,4,5].map(i=>`<button data-a="star" data-i="${i}" aria-label="${i} estrelas">★</button>`).join('')}</div>`;
const drv=(h)=>`<div class="row"><div class="av">👩🏾</div><div style="flex:1"><h2 id="ttl">${h}</h2><p class="mut">Yaris roxo · <span class="plate">LDG-247</span> · ★ 4,9</p></div></div><div class="bar"><div id="bar"></div></div><p class="mut" id="eta"></p>`;
const TPL={
 login:()=>`<div class="login-wrap" style="justify-content:center"><div class="login-head"><h2>Bem-vinda</h2><p class="mut">Mobilidade feminina segura</p></div><p class="login-err" id="loginErr"></p><button class="cta" data-a="role-pax">Login</button><button class="cta cta-ghost" data-a="go-register">Criar conta</button></div>`,
 cred:()=>`<div class="login-wrap" style="justify-content:center"><div class="login-head"><h2>Bem-vinda</h2><p class="mut">Número e senha para entrar</p></div><div class="flabel">Telemóvel · Angola</div><div class="field"><span style="color:#6a2bd6">+244</span><input id="credPhone" inputmode="tel" placeholder="9XX XXX XXX" style="border:0;outline:0;background:transparent;font:inherit;width:100%"></div><div class="flabel">Senha</div><div class="field"><input id="credPass" type="password" placeholder="Mín. 4 caracteres" style="border:0;outline:0;background:transparent;font:inherit;width:100%"></div><p class="login-err" id="loginErr"></p><button class="cta" data-a="do-credentials">Entrar →</button><button class="login-guest" data-a="back-login">← Voltar</button><button class="login-guest" data-a="go-register">Criar conta</button></div>`,
 register:()=>{let _r='PASSAGEIRA';try{_r=(localStorage.getItem('intendedRole')||'PASSENGER')==='DRIVER'?'MOTORISTA':'PASSAGEIRA'}catch(e){} return `<div class="login-wrap"><div class="login-head" style="padding-top:30px"><h2>Criar conta</h2><p class="mut">Perfil: <b>${_r}</b> · Só maiores de 18 anos</p></div><div class="flabel">Nome completo</div><div class="field"><input id="regName" placeholder="O teu nome" style="border:0;outline:0;background:transparent;font:inherit;width:100%"></div><div class="flabel">Data de nascimento</div><div class="field"><input id="regBirth" type="date" style="border:0;outline:0;background:transparent;font:inherit;width:100%"></div><div class="flabel">Telemóvel · Angola</div><div class="field"><span style="color:#6a2bd6">+244</span><input id="regPhone" inputmode="tel" placeholder="9XX XXX XXX" style="border:0;outline:0;background:transparent;font:inherit;width:100%"></div><div class="flabel">Senha</div><div class="field"><input id="regPass" type="password" placeholder="Mín. 4 caracteres" style="border:0;outline:0;background:transparent;font:inherit;width:100%"></div><label style="display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-top:8px"><input id="regT18" type="checkbox" style="margin-top:3px">Declaro que tenho 18 ou mais anos.</label><label style="display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-top:6px"><input id="regTT" type="checkbox" style="margin-top:3px"><span>Li e aceito os <button data-a="toggle-terms" style="color:#6a2bd6;font-weight:700;text-decoration:underline">Termos de Utilização</button>.</span></label><div id="termsBox" style="display:none;max-height:150px;overflow-y:auto;background:#fff;border:2px solid #e3d0f8;border-radius:12px;padding:10px 12px;font-size:12.5px;margin-top:6px"><b>Termos de Utilização — LadiesGo!</b><br>1. A LadiesGo! é uma plataforma que liga passageiras a motoristas mulheres verificadas.<br>2. Só maiores de 18 anos podem criar conta.<br>3. És responsável pela tua conta, senha e pelo telemóvel registado.<br>4. As motoristas passam por verificação de identidade e antecedentes; documentos falsos levam a suspensão imediata.<br>5. Preços: tarifa base + distância + tempo, por categoria, com possível dinâmica em ponta/noite — vês o preço antes de pedir.<br>6. Cancelamentos ficam registados; abusos repetidos suspendem a conta.<br>7. Segurança: botão SOS, partilha de rota e código de viagem — usa sempre que preciso.<br>8. É proibido: assédio, discriminação, fraude, contas falsas ou uso fora da app.<br>9. A plataforma responde pela seleção e verificação das motoristas.<br>10. Violações suspendem a conta.<br>11. Lei aplicável: República de Angola.</div><label style="display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-top:6px"><input id="regTP" type="checkbox" style="margin-top:3px"><span>Li e aceito a <button data-a="toggle-privacy" style="color:#6a2bd6;font-weight:700;text-decoration:underline">Política de Privacidade</button>.</span></label><div id="privBox" style="display:none;max-height:150px;overflow-y:auto;background:#fff;border:2px solid #e3d0f8;border-radius:12px;padding:10px 12px;font-size:12.5px;margin-top:6px"><b>Política de Privacidade — Lei n.º 22/11 (APDP) (demo)</b><br>1. Responsável: LadiesGo! — dados tratados em Angola.<br>2. Recolhemos: nome, telemóvel, foto, data de nascimento, localização durante o uso, viagens e pagamentos.<br>3. Finalidades: conta, verificação de identidade e idade, ligação passageira-motorista, preços, segurança e apoio.<br>4. Base legal: o teu consentimento — podes retirá-lo e pedir eliminação a qualquer momento.<br>5. Partilha mínima: a motorista vê só nome, foto e recolha da viagem aceite.<br>6. Direitos (Lei 22/11): acesso, retificação, eliminação e oposição — contacto na app.<br>7. Conservação só pelo tempo necessário, com segurança adequada.<br>8. Menores de 18 anos não podem registar-se.<br>9. Texto demo — validar com advogado e, se aplicável, registar junto da APDP.</div><p class="login-err" id="loginErr"></p><button class="cta" data-a="do-register">Criar conta →</button><button class="login-guest" data-a="back-login">← Voltar</button></div>`}, home:()=>`<h2>Olá, Beatriz 💜</h2><p class="mut">Só motoristas mulheres verificadas · 5 carros por perto</p><div class="field">📍 <span>${dest}</span></div><div class="chips">${['Casa','Trabalho','Shopping'].map(x=>`<button class="chip ${x==dest?'sel':''}" data-a="dest" data-d="${x}">${{Casa:'🏠',Trabalho:'💼',Shopping:'🛍'}[x]} ${x}</button>`).join('')}</div><button class="cta" data-a="opt">Para onde vamos?</button><nav class="tabs"><button class="a"><i>🏠</i>Início</button><button><i>🕘</i>Viagens</button><button data-a="sos"><i>🛡</i>Segurança</button><button><i>👤</i>Conta</button></nav>`,
 opt:()=>`<h2>Escolhe a tua viagem</h2><p class="mut">Para ${dest} · 9 min · 4,2 km</p><div style="height:8px"></div>${[['🚕','Básico','Chega em 3 min','2.800'],['💜','Conforto','Carro maior · 4 min','3.900'],['👧','Família','Cadeirinha de criança','4.200']].map((o,i)=>`<button class="opt ${i?'':'sel'}" data-a="pick"><span class="ico">${o[0]}</span><span><b>${o[1]}</b><span class="mut">${o[2]}</span></span><span class="pr">${o[3]} Kz</span></button>`).join('')}<button class="cta" data-a="req">Pedir LadiesGo</button>`,
 search:()=>`<div class="ct"><h2>A procurar motorista…</h2><p class="mut">Só mulheres verificadas, perto de ti</p><div class="dots"><i></i><i></i><i></i></div><button class="chip" data-a="home">Cancelar</button></div>`,
 drv:()=>drv('A Ana está a caminho')+`<div class="acts"><button>📞 Ligar</button><button>💬 Mensagem</button><button>🔗 Partilhar</button></div>`,
 ride:()=>drv('Em viagem com a Ana')+`<div class="acts"><button>🔗 Rota partilhada</button><button data-a="sos" style="background:#ffe3ef;color:#c2185b">🛡 SOS</button></div>`,
 done:()=>`<div class="ct"><h2>🎉 Chegaste em segurança</h2><p class="mut">Como foi a viagem com a Ana?</p>${stars}<button class="cta" data-a="fin">Concluir · 2.800 Kz</button></div>`};
const MAP={login:'login',cred:'cred',register:'register',home:'home',leave:'home',opt:'opt',search:'search',come:'drv',wave:'drv',board:'drv',ride:'ride',arrive:'ride',exit:'done'};
function go(p){ph=p;t=0;const s=MAP[p];if(s!==scr||p==='home'&&scr==='home'&&0){scr=s;const c=$('card');c.innerHTML=TPL[s]();c.classList.remove('swap');void c.offsetWidth;c.classList.add('swap')}}
async function doRoleLogin(role){
  try{localStorage.setItem('intendedRole',role)}catch(e){}
  go('cred');
}
async function doCredentialsLogin(){
  const errEl=document.getElementById('loginErr');
  const phoneEl=document.getElementById('credPhone');
  const passEl=document.getElementById('credPass');
  const phone=(phoneEl&&phoneEl.value)||'';
  const pass=(passEl&&passEl.value)||'';
  const digits=phone.replace(/\D/g,'');
  const local=digits.indexOf('244')===0?digits.slice(3):digits;
  if(!/^9[123459]\d{7}$/.test(local)){if(errEl)errEl.textContent='Número angolano inválido: 9XX XXX XXX.';return}
  if(pass.length<4){if(errEl)errEl.textContent='A senha deve ter pelo menos 4 caracteres.';return}
  let role='PASSENGER';
  try{role=localStorage.getItem('intendedRole')||'PASSENGER'}catch(e){}
  if(errEl)errEl.textContent='A entrar…';
  try{
    const r=await fetch('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:'+244'+local,password:pass,role:role})});
    const data=await r.json();
    if(data.accessToken){try{localStorage.setItem('taxi_token',data.accessToken);localStorage.setItem('taxi_user',JSON.stringify(data.user))}catch(e){}window.location.href=(data.user&&data.user.role==='ADMIN')?'/admin':'/home';return}
    else if(errEl)errEl.textContent=data.message||'Falha no login';
  }catch(e){if(errEl)errEl.textContent='Sem ligação ao servidor.'}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='dest'){dest=b.dataset.d;scr='';go('home')}
  else if(a==='opt')go('opt');else if(a==='req')go('search');else if(a==='home')go('home');
  else if(a==='pick'){document.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b))}
  else if(a==='star'){document.querySelectorAll('.stars button').forEach((x,j)=>x.classList.toggle('on',j<b.dataset.i))}
  else if(a==='fin'){W.x=270;W.dir=-1;W.op=0;go('leave')}
  else if(a==='role-pax')doRoleLogin('PASSENGER');
  else if(a==='role-drv')doRoleLogin('DRIVER');
  else if(a==='do-credentials')doCredentialsLogin();
  else if(a==='back-login')go('login');else if(a==='go-register')go('register');else if(a==='do-register')doRegister();else if(a==='toggle-terms')openTerms('termsBox');else if(a==='toggle-privacy')openTerms('privBox');else if(a==='close-terms')$('tmodal').classList.remove('on')
  else if(a==='sos')$('sos').classList.add('on');else if(a==='close')$('sos').classList.remove('on')});
function openTerms(id){const s=document.getElementById(id),b=document.getElementById('tbody');if(s&&b){b.innerHTML=s.innerHTML;$('tmodal').classList.add('on')}}
$('tmodal').addEventListener('click',e=>{if(e.target&&e.target.id==='tmodal')e.target.classList.remove('on')});

async function doRegister(){const errEl=document.getElementById('loginErr');const gv=id=>((document.getElementById(id)||{}).value||'').trim();const nm=gv('regName'),ph=gv('regPhone'),pw=((document.getElementById('regPass')||{}).value||'');const bi=gv('regBirth');const fail=m=>{if(errEl)errEl.textContent=m};if(nm.length<2)return fail('Escreve o teu nome.');const bd=new Date(bi+'T00:00:00');if(isNaN(bd))return fail('Data de nascimento inválida.');let age=new Date().getFullYear()-bd.getFullYear();const md=new Date();if(md.getMonth()<bd.getMonth()||(md.getMonth()===bd.getMonth()&&md.getDate()<bd.getDate()))age--;if(age<18)return fail('Só maiores de 18 anos.');const dg=ph.replace(/\D/g,'');const lc=dg.indexOf('244')===0?dg.slice(3):dg;if(!/^9[123459]\d{7}$/.test(lc))return fail('Número angolano inválido: 9XX XXX XXX.');if(pw.length<4)return fail('A senha deve ter pelo menos 4 caracteres.');if(!(document.getElementById('regT18')||{}).checked)return fail('Confirma que tens 18 ou mais anos.');if(!(document.getElementById('regTT')||{}).checked)return fail('Aceita os Termos de Utilização.');if(!(document.getElementById('regTP')||{}).checked)return fail('Aceita a Política de Privacidade.');let role='PASSENGER';try{role=localStorage.getItem('intendedRole')||'PASSENGER'}catch(e){}if(errEl)errEl.textContent='A criar conta…';try{const r=await fetch('/api/v1/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:'+244'+lc,password:pw,role:role,name:nm})});const d=await r.json();if(d.accessToken){d.user.name=nm;d.user.role=role;try{localStorage.setItem('taxi_token',d.accessToken);localStorage.setItem('taxi_user',JSON.stringify(d.user));localStorage.setItem('lg_account',JSON.stringify({name:nm,phone:'+244'+lc,birth:bi,photo:window._regPhoto,role:role,at:Date.now()}))}catch(e){}window.location.href='/home';return}fail(d.message||'Falha no registo');}catch(e){fail('Sem ligação ao servidor.')}}/* motor da cena */
const W={x:270,dir:-1,op:1,vis:1};let dist=0,speed=0,tx=140,prev=tx,rot=0,last=performance.now(),cur='';
const $$=(id,v)=>$(id).textContent=v,pop=()=>{const p=$('pop');p.classList.remove('go');void p.getBoundingClientRect();p.classList.add('go')};
const layers=[['L1',.12],['L2',.3],['L3',1],['L4',1.25]];
go('login');
function frame(now){
  const dt=Math.min((now-last)/1000,.05);last=now;t+=dt;const T=now/1000;let walk=0,wave=0;
  if(ph==='login'){
    const ct=t%26;
    if(ct<5){speed=lerp(speed,0,dt*3);tx=lerp(tx,110,Math.min(1,dt*1.2));W.x=270;W.dir=-1;W.vis=1;W.op=Math.min(1,W.op+dt*2);wave=0;walk=0;$('pax').setAttribute('display','none')}
    else if(ct<7){wave=1;walk=0}
    else if(ct<10){wave=0;walk=1;W.x-=42*dt;if(W.x<=tx+52){W.vis=0;$('pax').setAttribute('display','');pop()}}
    else if(ct<17){walk=0;speed=lerp(speed,90,dt*2)}
    else if(ct<19.5){speed*=Math.max(0,1-dt*2.4);if(speed<2&&$('pax').getAttribute('display')!=='none'){speed=0;$('pax').setAttribute('display','none');W.x=tx+52;W.dir=1;W.vis=1;W.op=1;pop()}}
    else if(ct<22){walk=1;W.x+=38*dt;W.op=Math.max(0,W.op-dt*1.2)}
    else{walk=0;wave=0;tx+=260*dt;W.x+=38*dt;if(tx>480){tx=-170;W.x=270;W.dir=-1;W.vis=1;W.op=0;$('pax').setAttribute('display','none')}}
  }
  else if(ph==='search'&&t>2.6)go('come');
  else if(ph==='come'){tx=lerp(tx,110,Math.min(1,dt*1.5));if($('bar')){$('bar').style.width=Math.min(1,(tx+170)/280)*100+'%';$$('eta',`Chega em ${Math.max(1,Math.ceil((110-tx)/95))} min`)}if(110-tx<1.5){tx=110;go('wave')}}
  else if(ph==='wave'){wave=1;$$('ttl','A Ana chegou!');$$('eta','Confere a placa LDG-247 antes de entrar');if(t>2)go('board')}
  else if(ph==='board'){walk=1;W.x-=42*dt;if(W.x<=tx+52){W.vis=0;$('pax').setAttribute('display','');pop();go('ride')}}
  else if(ph==='ride'){speed=lerp(speed,90,dt*2);$('bar').style.width=Math.min(t/8,1)*100+'%';$$('eta',`Chegas em ${Math.max(1,Math.ceil(8*(1-t/8)))} min · rota partilhada com 2 contactos`);if(t>8)go('arrive')}
  else if(ph==='arrive'){speed*=Math.max(0,1-dt*2.4);$$('ttl','A chegar ao destino…');if(speed<2){speed=0;$('pax').setAttribute('display','none');W.x=tx+52;W.dir=1;W.vis=1;W.op=1;pop();go('exit')}}
  else if(ph==='exit'){if(W.x<250){walk=1;W.x+=38*dt}else wave=1}
  else if(ph==='leave'){tx+=(60+t*380)*dt;W.op=0;if(tx>460){tx=140;go('home')}}
  else{W.op=Math.min(1,W.op+dt)}
  dist+=speed*dt;
  layers.forEach(([id,k])=>$(id).setAttribute('transform',`translate(${-(dist*k%400)} 0)`));
  const vel=(tx-prev)/Math.max(dt,.001)+speed;prev=tx;rot=(rot+vel*dt/9*57.3)%360;
  $('wB').setAttribute('transform',`translate(26 40) rotate(${rot})`);$('wF').setAttribute('transform',`translate(96 40) rotate(${rot})`);
  $('T').setAttribute('transform',`translate(${tx.toFixed(1)} ${(219+Math.sin(now/45)*.7*Math.min(1,Math.abs(vel)/90)+Math.sin(now/420)*.3).toFixed(2)})`);
  amb.forEach(a=>{a.x+=(a.v-speed)*dt;if(a.x>480)a.x=-130;if(a.x<-130)a.x=480;a.g.setAttribute('transform',a.dir>0?`translate(${a.x.toFixed(1)} 196) scale(.95)`:`translate(${(a.x+116).toFixed(1)} 196) scale(-.95 .95)`)});
  const w=$('woman');w.setAttribute('display',W.vis?'':'none');w.setAttribute('opacity',W.op);w.setAttribute('transform',`translate(${W.x.toFixed(1)} 212) scale(${W.dir} 1)`);
  const sw=walk?Math.sin(T*12)*28:0;
  $('lg1').setAttribute('transform',`translate(-3 -16) rotate(${sw})`);$('lg2').setAttribute('transform',`translate(3 -16) rotate(${-sw})`);
  $('arm').setAttribute('transform',`translate(6 -32) rotate(${wave?160+Math.sin(T*11)*24:-sw})`);
  const showPin=['home','opt','search','come','wave'].includes(ph);
  $('pin').setAttribute('display',showPin?'':'none');$('pin').setAttribute('transform',`translate(0 ${Math.sin(T*4)*2.5})`);
  $('rg').setAttribute('display',ph==='search'?'':'none');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
